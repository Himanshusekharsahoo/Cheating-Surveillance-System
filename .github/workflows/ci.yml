name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Model-Independent Unit Tests (Windows / Python 3.13)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install minimal unit test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python pytest cryptography

      - name: Run unit tests
        run: |
          python -m pytest -m unit

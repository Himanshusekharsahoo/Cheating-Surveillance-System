[pytest]
minversion = 7.0
testpaths = tests
markers =
    unit: Isolated unit tests using controlled mocks or pure algorithmic logic (no model weights or external assets required).
    integration: Real integration tests requiring loaded models (dlib shape predictor, YOLO checkpoint) and genuine runtime dependencies.
    demo_video: End-to-end tests requiring video files in Demo_vid/.
    hardware: Hardware-dependent tests requiring an attached physical webcam device.
addopts = -v -m "not hardware and not demo_video"
